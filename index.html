<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clan ЧСВ - Магазин</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #1a1a1a);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 16px;
            padding-bottom: 90px;
        }
        h1 { text-align: center; font-size: 22px; margin-bottom: 4px; color: #ffb700; }
        .subtitle { text-align: center; font-size: 13px; color: #aaa; margin-bottom: 20px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #2c2c2c);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card h3 { font-size: 14px; margin: 5px 0; }
        .card p { font-size: 13px; color: #ffb700; margin: 5px 0; }
        .card button {
            background-color: #ffb700;
            color: #000;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
        }
        .cart-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--tg-theme-secondary-bg-color, #222);
            padding: 12px 16px;
            border-top: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .checkout-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>clan ЧСВ</h1>
    <div class="subtitle">Официальный магазин клана</div>

    <div class="grid" id="product-grid">
        <div class="card">
            <h3>Пак СМГ</h3>
            <p>15 руб.</p>
            <button onclick="addToCart('Пак СМГ', 15)">В корзину</button>
        </div>
        <div class="card">
            <h3>Пак патронов</h3>
            <p>50 руб.</p>
            <button onclick="addToCart('Пак патронов', 50)">В корзину</button>
        </div>
        <div class="card">
            <h3>Пак металла (10k)</h3>
            <p>100 руб.</p>
            <button onclick="addToCart('Пак металла (10k)', 100)">В корзину</button>
        </div>
        <div class="card">
            <h3>Топовый кит (оружие)</h3>
            <p>250 руб.</p>
            <button onclick="addToCart('Топовый кит (оружие)', 250)">В корзину</button>
        </div>
    </div>

    <!-- Корзина -->
    <div class="cart-container">
        <div>
            <b>Корзина:</b> <span id="cart-count">0</span> шт.<br>
            <span id="total-price" style="color: #ffb700; font-weight: bold;">Итого: 0 руб.</span>
        </div>
        <button class="checkout-btn" onclick="checkout()">Оформить</button>
    </div>

    <script>
        let cart = [];

        function addToCart(name, price) {
            let existingItem = cart.find(item => item.name === name);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ name: name, price: price, quantity: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            let totalCount = 0;
            let totalPrice = 0;
            cart.forEach(item => {
                totalCount += item.quantity;
                totalPrice += item.price * item.quantity;
            });
            document.getElementById('cart-count').innerText = totalCount;
            document.getElementById('total-price').innerText = 'Итого: ' + totalPrice + ' руб.';
        }

        function checkout() {
            alert('Кнопка нажата!'); // Проверка, срабатывает ли вообще функция

            if (cart.length === 0) {
                alert('Корзина пуста! Добавьте товар.');
                return;
            }

            const BOT_TOKEN = '8829327875:AAE0ChfpfnatcXVLkDJW7pv4grEE5m6t5_w';
            const CHAT_ID = '455307806';

            let totalPrice = 0;
            let message = '🚨 Новый заказ в магазине ЧСВ!\n\n';

            cart.forEach(item => {
                let sum = item.price * item.quantity;
                totalPrice += sum;
                message += `- ${item.name} x${item.quantity} (${sum} руб.)\n`;
            });

            message += `\nИтого: ${totalPrice} руб.`;

            alert('Отправка запроса в Telegram...');

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message
                })
            })
            .then(response => response.json())
            .then(data => {
                alert('Ответ от Telegram получен: ' + JSON.stringify(data));
                if (data.ok) {
                    alert('Заказ успешно отправлен!');
                    cart = [];
                    updateCartUI();
                } else {
                    alert('Ошибка от Telegram: ' + (data.description || 'неизвестно'));
                }
            })
            .catch(error => {
                alert('Ошибка сети: ' + error.message);
            });
        }
    </script>
</body>
</html>
